# =============================================================================
# Security headers (per OWASP ZAP audit)
# -----------------------------------------------------------------------------
# This fragment is included at `server` level and in `location` blocks that
# define their own `add_header` (e.g. static assets), because Nginx does NOT
# inherit `add_header` directives from a parent block when the child block
# defines its own.
# `always` is used so the header is also sent on responses like sitemap.xml
# and on 4xx/5xx status codes.
# The CSP is based exclusively on the resources actually used:
#   - own JS/CSS assets (same-origin)                    -> 'self'
#   - inline styles generated by React                   -> 'unsafe-inline'
#   - local fonts in /unal/fonts                         -> 'self'
#   - external images on the public landing page         -> images.unsplash.com
#   - frontend API                                       -> same-origin
# No Google Fonts / Bunny / CDN domains are added because fonts are already
# self-hosted.
# =============================================================================
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; media-src 'self'; frame-src 'none'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;