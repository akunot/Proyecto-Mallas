[supervisord]
nodaemon=true
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/nginx-access.log
stderr_logfile=/var/www/html/storage/logs/nginx-error.log

[program:php-fpm]
command=php-fpm -F
user=root
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/php-fpm.log
stderr_logfile=/var/www/html/storage/logs/php-fpm.log

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=1 --tries=3 --max-time=3600
user=app
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/queue-worker-%(process_num)02d.log
stderr_logfile=/var/www/html/storage/logs/queue-worker-%(process_num)02d.log
