version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mallas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-mallas_db}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mallas_app
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mallas_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      MAIL_MAILER: log
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app
      - storage_framework:/var/www/html/storage/framework
      - storage_logs:/var/www/html/storage/logs

volumes:
  mysql_data:
  storage_data:
  storage_framework:
  storage_logs:
